[project]
name = "sentimentanalysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SreeramKalluri-In", email = "sreeram.kalluri@innomatics.in" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "kaggle>=2.2.4",
    "lxml>=6.1.3",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
sentimentanalysis = "sentimentanalysis:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
